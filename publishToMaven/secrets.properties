# Copy this file to secrets.properties (same folder) and fill in values.
# secrets.properties is gitignored.
#
# If you see: "Failed to stop service 'sonatype-repository-build-service'" / "Cannot query
# the value of this property":
# 1) Fix the *first* error above it in the log (often GPG/signing or empty token fields).
# 2) Use: ./publishToMaven/publish-central.sh
# 3) Ensure mavenCentralUsername and mavenCentralPassword are non-empty (Central Portal token).
#
# Maven Central — vanniktech reads EXACT names (lowercase m). Wrong casing breaks Sonatype:
# https://github.com/vanniktech/gradle-maven-publish-plugin/issues/866
#
# Important: those props must be visible as ROOT Gradle properties (same as root gradle.properties).
# Signing.* may appear to work from another file; mavenCentral* often does not. This repo loads
# publishToMaven/secrets.properties in root build.gradle.kts for all projects AND publish-central.sh
# exports ORG_GRADLE_PROJECT_mavenCentral* so the root project always sees them.
# Fallback: copy the two lines into ~/.gradle/gradle.properties (never commit).
#
# https://central.sonatype.com/ → Profile → User token → Generate token
mavenCentralUsername=
mavenCentralPassword=

# Optional legacy names (some scripts); keep in sync with mavenCentral* if you use both
ossrhUsername=
ossrhPassword=

# Optional: GitHub Packages
gpr.user=
gpr.token=

# GPG signing (required for releases). Export your public key to a keyserver first.
# https://central.sonatype.org/publish/requirements/gpg/
#
# File-based (Gradle needs a real exported secret keyring — not a .rev file):
#   chmod +x publishToMaven/export-secring-for-gradle.sh
#   ./publishToMaven/export-secring-for-gradle.sh
# Or manually:
#   gpg --output ~/.gnupg/gradle-secring.gpg --export-secret-keys YOUR_KEY_ID
#
# Must be short form: 8 hex chars (e.g. A4D45791) or 0xA4D45791 — not the 16-char key id
signing.keyId=
signing.password=
signing.secretKeyRingFile=/Users/YOU/.gnupg/gradle-secring.gpg

# Optional CI: in-memory key instead of secretKeyRingFile (see vanniktech central.md)
# signingInMemoryKey=
# signingInMemoryKeyId=
# signingInMemoryKeyPassword=

# After secrets.properties is filled, publish to Maven Central (preferred):
#   ./publishToMaven/publish-central.sh
# Or:
#   ./gradlew :toastxLib:publishAndReleaseToMavenCentral --no-configuration-cache
#
# Dry-run locally (set MAVEN_PUBLISH_SIGNING=false in gradle.properties if you have no GPG yet):
#   ./publishToMaven/publish.sh
